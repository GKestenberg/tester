[project]
name = "hello-world"
version = "0.1.0"
description = "A simple FastAPI hello world server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "boto3>=1.35.0",
    "temporalio>=1.7.0",
    "python-dotenv>=1.0.0",
    "prometheus-client>=0.21.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
